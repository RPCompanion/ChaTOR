<!doctype html>
<!-- Dev-only preview of the UI in a normal browser (no Tauri). Not part of the build.
     Open http://localhost:<vite port>/preview.html#/automatic
     Query flags: capture=1 (chat log window), theme=dark|lighter|light, click=Label,Label (press buttons after load), hover=Text (show a tooltip) -->
<html lang="en" data-theme="lighter">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaTOR preview</title>
    <script>
      (async () => {
        const defaults = await fetch("/src/lib/network/default_settings.json").then((r) => r.json());
        const q = new URLSearchParams(location.search);
        // ?capture=1 shows the chat log window with sample messages
        if (q.get("capture") === "1") {
          defaults.chat_log.capture_chat_log = true;
          defaults.chat_log.window.show_chat_log_window = true;
        }
        if (q.get("decorations") === "1") defaults.app.show_window_decorations = true;
        if (q.get("theme")) defaults.app.theme = q.get("theme");
        let cb_id = 0;
        const sample_messages = [
          { timestamp: new Date().toISOString(), from: "Elizala", to: "", channel: { type: 3 }, message_fragments: [{ type: "Text", text: "Elizala looks around the cantina." }], message: "Elizala looks around the cantina." },
        ];
        const items = [
          { name: "Red Crystal", ids: ["16141067450205160335"] },
          { name: "Red Crystal Container", ids: ["16141067450205160336"] },
          { name: "Red Sharp Crystal", ids: ["16141067450205160337", "16141067450205160338"] },
          { name: "Advanced Red Eviscerating Crystal", ids: ["16141067450205160339", "16141067450205160340", "16141067450205160341"] },
        ];
        const tooltip = (id) => ({
          kind: "item", id, name: items.find((i) => i.ids.includes(id))?.name ?? "Red Crystal", quality: "premium", icon_url: null,
          cartel_market: false, count: null, roll_level: null, binding: "Binds on Equip", unique: false, armor_type: null,
          durability: null, stats: [{ name: "Critical Rating", value: 41 }], modifications: [], required_level: 10,
          abilities: [], description: "A crystal that can be used in lightsabers and blasters.",
        });
        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: "main" },
            currentWebview: { label: "main", windowLabel: "main" },
            windows: [{ label: "main" }],
            webviews: [{ label: "main", windowLabel: "main" }],
          },
          transformCallback(cb) { const id = ++cb_id; window[`_${id}`] = cb; return id; },
          convertFileSrc(p) { return p; },
          async invoke(cmd, args) {
            switch (cmd) {
              case "get_settings": return defaults;
              case "get_version": return "0.1.43";
              // ?auth=signed_in|banned|offline (default signed_out)
              case "auth_status": case "auth_sign_out": {
                const state = cmd === "auth_status" ? (q.get("auth") ?? "signed_out") : "signed_out";
                if (state === "signed_in") return { state, persisted: true, account: { account_id: "00000000-0000-4000-8000-000000000000", created_at: "2026-10-19T00:00:00Z", identities: [{ provider: "discord", display_name: "Elizala", avatar_url: null }] } };
                if (state === "banned") return { state, ban: { reason: "Harassment in global chat", expires_at: null } };
                return { state };
              }
              case "auth_sign_in": return new Promise(() => {});
              case "get_todays_chat_log": case "get_distinct_dates": case "get_all_date_tag_favourites": return [];
              case "plugin:event|listen": return 1;
              case "search_game_items": {
                const terms = args.query.toLowerCase().split(/\s+/).filter(Boolean);
                return items.filter((i) => terms.every((t) => i.name.toLowerCase().includes(t)));
              }
              case "get_game_tooltip": return tooltip(args.globalId);
              case "get_item_link": return '<HL LID="BCOAAl1OxGUOPAAABh">';
              case "plugin:window|is_maximized": return false;
              case "plugin:window|inner_size": case "plugin:window|outer_size": return { width: 800, height: 900 };
              default:
                if (cmd.startsWith("get_all")) return [];
                if (cmd.startsWith("get_")) return null;
                return null;
            }
          },
        };
        window.__TAURI_INTERNALS__.invoke.__shim = true;
        const s = document.createElement("script"); s.type = "module"; s.src = "/src/main.tsx"; document.body.appendChild(s);
        // ?click=<aria-label or button text>,<...>  clicks those buttons in order after load;
        // a step "=<text>" types <text> into the focused input instead
        const clicks = (q.get("click") || "").split(",").filter(Boolean);
        if (clicks.length) {
          let i = 0;
          const tick = () => {
            if (i >= clicks.length) return;
            const want = clicks[i];
            if (want.startsWith("=")) {
              const el = document.activeElement;
              const setter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), "value")?.set;
              if (setter) { setter.call(el, want.slice(1)); el.dispatchEvent(new Event("input", { bubbles: true })); i++; }
              setTimeout(tick, 400);
              return;
            }
            const btn = [...document.querySelectorAll("button")].find(
              (b) => b.getAttribute("aria-label") === want || b.textContent.trim() === want
            );
            if (btn) { btn.click(); i++; }
            setTimeout(tick, 300);
          };
          setTimeout(tick, 800);
        }
        // ?hover=<text>  fires mouseover on the first element containing that text (tooltips)
        const hover = q.get("hover");
        if (hover) {
          setTimeout(() => {
            const el = [...document.querySelectorAll("div,span,button")].find((e) => e.children.length === 0 && e.textContent.trim() === hover);
            if (el) el.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
          }, 1200);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
