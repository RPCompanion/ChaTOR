[package]
name = "chator"
version = "0.1.43"
description = "A Chat system for Star Wars: The Old Republic."
authors = ["Emma Davenport"]
license = "AGPL-3.0"
repository = ""
default-run = "chator"
edition = "2021"

[lib]
name = "chator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# Async
futures = "0.3"
tokio = { version = "1", features = ["time", "macros"] }

# Database
rusqlite = { version = "0.40", features = ["bundled", "uuid", "serde_json"] }

# GUI
tauri = { version = "2", features = [ "devtools"] }

# Hashing
sha2 = "0.11"
base64 = "0.23"
uuid = "1.10"

# Helpers
int-enum = "1.1"

# Local System
directories = "6.0"
open = "5.1"
sysinfo = "0.39"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4.4"
regex = "1.10"
clap = { version = "4.5.17", features = ["derive"] }
thiserror = "2.0"
encoding_rs = "0.8"

# Project Specific
chator-macros = { git = "https://github.com/RPCompanion/chator-macros" }
em-libs = { git = "https://github.com/Davenport-Physics/EmLibs" }

# Serialization/Formats
rust-ini = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Web
# reqwest 0.13 defaults to rustls/aws-lc; keep the native TLS backend (OpenSSL / Schannel) used before.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
scraper = "0.27"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
native-dialog = "0.9.6"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
