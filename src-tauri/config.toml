
microsoft_webview2_url = "https://developer.microsoft.com/en-us/microsoft-edge/webview2/?form=MA13LH"
# Relative paths resolve against the app directory. chator-service/build.sh
# copies chator-service.exe + swtor_chat_capture.dll into src-tauri/service/.
service_binary_path    = "service/chator-service.exe"
# GET endpoint serving an offsets.json document (same schema as offsets.json)
# with hook offsets for the latest swtor.exe builds. Leave unset to skip.
# offsets_url = "https://example.invalid/chator/offsets.json"
# Item / quest / achievement names are read from the installed game. Steam installs (and the
# default EA/BioWare launcher folder on Windows) are found automatically; otherwise point this
# at the folder that contains "Assets".
# swtor_install_path = "C:/Program Files (x86)/Electronic Arts/BioWare/Star Wars - The Old Republic"
